# One ContentCoach preview. bin/factory-box runs it as compose project
# cc-pr-<N> with these set: PR, IMAGE_API, IMAGE_WEB, PREVIEW_HOST, DB_URL,
# MEDIA_DIR, SESSION_SECRET. Offline: no model, scraper, payment or Telegram
# keys exist in here at all.
name: cc-pr-${PR}

x-app: &app
  image: ${IMAGE_API}
  networks: [factory]
  environment: &env
    CC_ENV: staging
    DATABASE_URL: ${DB_URL}
    MIGRATE_DATABASE_URL: ${DB_URL}
    CC_APP_DATABASE_URL: ${DB_URL}
    WEB_BASE_URL: https://${PREVIEW_HOST}/app
    WEB_SESSION_SECRET: ${SESSION_SECRET}
    CC_LOG_DIR: /app/var/log
  volumes:
    - ${MEDIA_DIR}:/app/var/media
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:
  migrate:
    <<: *app
    container_name: cc-pr-${PR}-migrate
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && { cc collections sync --yes || true; }"]

  api:
    <<: *app
    container_name: cc-pr-${PR}-api
    restart: unless-stopped
    # offline (no --live) and with the job worker in-process
    command: ["cc", "api", "--host", "0.0.0.0", "--port", "8010"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8010/api/health', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20

  web:
    image: ${IMAGE_WEB}
    container_name: cc-pr-${PR}-web
    restart: unless-stopped
    networks: [factory]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: cc-pr-${PR}-api:8010
    mem_limit: 128m

networks:
  factory:
    external: true
