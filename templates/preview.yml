name: Preview

# Generated by `factory init __PROJECT__` (github.com/omardmv/factory).
# Every PR (except release PRs into main) gets its own live preview on the
# VPS: the project's own containers and a disarmed copy of its source data,
# e2e tests with a video of every test, one PR comment. Closing the PR
# deletes all of it. Runs on a self-hosted runner labelled "factory".

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  PR: ${{ github.event.pull_request.number }}
  BRANCH: ${{ github.head_ref }}
  SHA: ${{ github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}
  MARKER: "<!-- factory-preview -->"

jobs:
  up:
    if: github.event.action != 'closed' && github.event.pull_request.base.ref != 'main'
    runs-on: [self-hosted, factory]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the preview
        id: up
        run: |
          url="$(factory-box up __PROJECT__ "$PR" "$GITHUB_WORKSPACE" "$BRANCH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "host=$(printf '%s' "$url" | sed -E 's#https://([^/]+)/.*#\1#')" >> "$GITHUB_OUTPUT"

      - name: E2E tests with video
        id: e2e
        if: steps.up.outcome == 'success'
        run: |
          set +e
          summary="$(factory-box e2e __PROJECT__ "$PR" "$GITHUB_WORKSPACE" "$SHA")"
          code=$?
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Comment on the PR
        if: always()
        env:
          OK: ${{ steps.up.outcome == 'success' }}
          E2E: ${{ steps.e2e.outputs.summary }}
          E2E_OK: ${{ steps.e2e.outcome == 'success' }}
          HOST: ${{ steps.up.outputs.host }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          snap="$(docker exec factory-pg-1 psql -U factory -d postgres -Atc \
            "select shobj_description(oid, 'pg_database') from pg_database where datname = '__PREFIX___snapshot'")"
          if [ "$OK" = true ]; then
            body="$MARKER
          ### Preview ready · \`${SHA:0:7}\`

          | | |
          | --- | --- |
          | App | https://$HOST/app/ |
          | Sign in | https://$HOST/_factory/login (signs you in) |
          | Data | ${snap:-staging snapshot} (disarmed: no live jobs, card tokens or login links) |
          | Mode | offline, no outside services |
          | E2E | $( [ "$E2E_OK" = true ] && echo "✅" || echo "❌" ) ${E2E:-did not run} · videos: https://$HOST/_factory/ |

          The preview password: \`ssh vps cat /opt/factory/preview-password\` (user \`factory\`)."
          else
            body="$MARKER
          ### Preview failed · \`${SHA:0:7}\`

          See the run: $RUN"
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

  down:
    if: github.event.action == 'closed'
    runs-on: [self-hosted, factory]
    timeout-minutes: 10
    steps:
      - name: Delete the preview
        run: factory-box down __PROJECT__ "$PR"

      - name: Mark the comment
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)"
          [ -z "$id" ] || gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
            -f body="$MARKER
          ### Preview deleted
          The PR was closed: its containers, database, media and test videos are gone." >/dev/null
