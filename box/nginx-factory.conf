# factory.contentcoach.org -> the factory dashboard (Coolify app, loopback).
# Cloudflare-only like every vhost; no basic auth: the dashboard signs you in
# and its cookie then covers every preview and Coolify's front door.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name factory.contentcoach.org;
    ssl_certificate     /etc/ssl/cloudflare/contentcoach.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/contentcoach.org.key;
    if ($from_cloudflare = 0) { return 444; }
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:19200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
