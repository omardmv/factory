# Host nginx vhost for every preview: <feature>-pr<N>.contentcoach.org.
# Exact names (staging., admin., software., ...) always win over a regex,
# and this regex only matches hosts ending in -pr<digits>.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^[a-z0-9-]+-pr\d+\.contentcoach\.org$;
    ssl_certificate     /etc/ssl/cloudflare/contentcoach.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/contentcoach.org.key;
    if ($from_cloudflare = 0) {
        return 444;
    }
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    # previews hold a copy of staging's real data
    auth_basic "factory preview";
    auth_basic_user_file /opt/factory/htpasswd;

    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:19100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
