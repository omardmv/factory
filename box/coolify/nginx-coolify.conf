# coolify.contentcoach.org -> Coolify on loopback (dashboard 8000, realtime 6001,
# terminal 6002). Cloudflare-only like every vhost here; the dashboard sits
# behind the factory password AND Coolify's own login. GitHub's webhooks skip
# the password (GitHub cannot send one) - Coolify checks their signatures.
map $http_upgrade $coolify_connection { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coolify.contentcoach.org;
    ssl_certificate     /etc/ssl/cloudflare/contentcoach.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/contentcoach.org.key;
    if ($from_cloudflare = 0) { return 444; }
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 64m;

    include /opt/factory/src/box/nginx-factory-auth.inc;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $coolify_connection;
    proxy_read_timeout 300s;

    location ^~ /webhooks/ {
        auth_basic off;
        auth_request off;
        proxy_pass http://127.0.0.1:8000;
    }
    location ^~ /app/ { proxy_pass http://127.0.0.1:6001; }
    location ^~ /terminal/ws { proxy_pass http://127.0.0.1:6002; }
    location / { proxy_pass http://127.0.0.1:8000; }
}
