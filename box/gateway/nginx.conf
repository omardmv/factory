# Routes a preview host to its web container by PR number alone.
# Docker's embedded DNS (127.0.0.11) finds cc-pr-<N>-web on the "factory"
# network, so nothing here changes per PR.

map $host $project {
    ~\.contentcoach\.org$  cc;
    default                "";
}

map $host $pr {
    ~^[a-z0-9-]+-pr(?<n>\d+)\.  $n;
    default                     "";
}

server {
    listen 80 default_server;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 64m;

    # e2e reports and videos for this PR
    location /_factory/ {
        if ($pr = "") { return 404; }
        alias /srv/artifacts/$project/pr-$pr/;
        autoindex on;
    }

    location / {
        if ($pr = "") { return 404; }
        set $upstream http://$project-pr-$pr-web:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @no_preview;
    }

    location @no_preview {
        default_type text/plain;
        return 404 "No preview is running for PR $pr.\nIt starts on the next push, or with: factory up $project $pr\n";
    }
}
