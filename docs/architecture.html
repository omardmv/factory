<text class="title" x="30" y="74">The Software Factory</text>
<text class="s" x="34" y="106">every pull request becomes its own live preview environment, tested and recorded, on our own server · any number of projects · $0</text>

<circle cx="1420" cy="40" r="8" fill="#f1e9ff" stroke="#7a4bd1"/><text class="t p" x="1436" y="46">AI agent</text>
<circle cx="1420" cy="68" r="8" fill="#e3f6ef" stroke="#0f8a6a"/><text class="t g" x="1436" y="74">Factory (our scripts)</text>
<circle cx="1420" cy="96" r="8" fill="#ececfb" stroke="#4b4b9a"/><text class="t k" x="1436" y="102">Coolify (maintained, self-hosted)</text>

<rect x="176" y="192" width="128" height="58" rx="10" fill="#f1e9ff" stroke="#7a4bd1"/>
<text class="t p" x="240" y="216" text-anchor="middle">Coding agents</text><text class="s" x="240" y="237" text-anchor="middle">a worktree each</text>
<rect x="40" y="264" width="264" height="58" rx="10" fill="#f1e9ff" stroke="#7a4bd1"/>
<text class="t p" x="172" y="288" text-anchor="middle">Background agents</text><text class="s" x="172" y="309" text-anchor="middle">open PRs while you are away</text>
<text class="s" x="40" y="350">phone: Remote Control</text>

<text class="s" x="40" y="394">API · screenshots · live browser</text>

<text class="h b" x="384" y="160">Pull request</text>
<rect x="378" y="172" width="220" height="230" rx="8" fill="#f6f8fb" stroke="#555" stroke-width="1.6"/>
<rect x="394" y="192" width="188" height="34" rx="4" fill="#fff" stroke="#888"/><text class="t" x="406" y="215">#41 feat/checkout</text>
<text class="s" x="394" y="256">into the integration branch</text>
<text class="s" x="394" y="278">one push fires two things:</text>
<text class="s b" x="394" y="306">① webhook → Coolify</text>
<text class="s b" x="394" y="330">② workflow → our runners</text>
<text class="s" x="394" y="370">never straight to production</text>
<path class="arr" d="M602 250 L654 250"/>
<path class="arr" d="M602 330 L654 330"/>

<text class="h k" x="664" y="160">① Coolify builds the preview</text>
<rect x="658" y="172" width="400" height="120" rx="8" fill="#ececfb" stroke="#4b4b9a"/>
<text class="t k" x="676" y="200">GitHub App webhook → build the branch</text>
<text class="s" x="676" y="224">reads the repo's preview.compose.yaml</text>
<text class="s" x="676" y="246">one compose project per PR, own network + volumes</text>
<text class="s" x="676" y="268">routes pr41.&lt;domain&gt; · deletes it all on close</text>
<text class="h g" x="664" y="320">② CI on our server</text>
<rect x="658" y="330" width="400" height="72" rx="8" fill="#e3f6ef" stroke="#0f8a6a"/>
<text class="t g" x="676" y="358">self-hosted runners, several in parallel</text>
<text class="s" x="676" y="382">0 GitHub minutes · wait for ① then test</text>
<path class="arr" d="M1062 232 L1110 232"/>
<path class="arr" d="M1062 366 L1110 366"/>

<text class="h p" x="1120" y="160">E2E tests on the preview</text>
<rect class="frame" x="1114" y="172" width="360" height="230" rx="6"/>
<rect x="1132" y="192" width="324" height="70" rx="8" fill="#f1e9ff" stroke="#7a4bd1"/>
<text class="t p" x="1148" y="218">tester-army, model-free</text>
<text class="s" x="1148" y="242">signs in like a real user, one click</text>
<rect x="1132" y="276" width="324" height="106" rx="8" fill="#fff" stroke="#888"/>
<rect x="1148" y="292" width="42" height="30" rx="3" fill="#eee" stroke="#999"/><path d="M1163 299 L1177 307 L1163 315 Z" fill="#999"/>
<rect x="1198" y="292" width="42" height="30" rx="3" fill="#eee" stroke="#999"/><path d="M1213 299 L1227 307 L1213 315 Z" fill="#999"/>

<text class="s" x="1148" y="346">a video of every test, trace on failure</text>
<text class="s" x="1148" y="368">gallery at /_factory/</text>

<text class="h b" x="1536" y="160">One PR comment</text>
<rect x="1530" y="172" width="344" height="230" rx="8" fill="#f6f8fb" stroke="#555" stroke-width="1.6"/>
<text class="t" x="1548" y="208">Preview  pr41.&lt;domain&gt;</text>
<text class="t" x="1548" y="236">Sign in  one click</text>
<text class="t" x="1548" y="264">E2E  12 passed ▶ videos</text>
<text class="t" x="1548" y="292">Data  snapshot of 03:00</text>
<text class="s" x="1548" y="334">updated on every push</text>
<text class="s" x="1548" y="356">check it on the phone</text>
<text class="s r" x="1548" y="384">red → the agent fixes, pushes</text>

<!-- ============ ROW 2: inside one preview ============ -->
<text class="h" x="30" y="456">Inside one preview environment · PR #41</text>
<text class="s" x="440" y="456">(plain containers on our shared server, isolated by data, network and login · not a security sandbox)</text>

<!-- request path -->
<text class="t k" x="44" y="504">How a request reaches it</text>
<rect x="44" y="518" width="150" height="62" rx="8" fill="#fff" stroke="#888"/>
<text class="t" x="119" y="544" text-anchor="middle">browser / e2e</text><text class="s" x="119" y="566" text-anchor="middle">pr41.&lt;domain&gt;</text>

<!-- containers -->
<rect x="882" y="490" width="972" height="250" rx="10" fill="#f4f4fd" stroke="#4b4b9a"/>
<text class="t k" x="900" y="516">containers of PR #41 · started in this order, each waits for the one before</text>
<rect x="900" y="532" width="170" height="92" rx="8" fill="#fff1e0" stroke="#b7651a"/>
<text class="t o" x="985" y="558" text-anchor="middle">1 · preview-init</text>
<text class="s" x="985" y="580" text-anchor="middle">copies the data</text>
<text class="s" x="985" y="600" text-anchor="middle">makes its own login</text>
<text class="s" x="985" y="618" text-anchor="middle">runs once, then exits</text>
<path class="arr" d="M1074 578 L1094 578"/>
<rect x="1098" y="532" width="150" height="92" rx="8" fill="#fff" stroke="#888"/>
<text class="t" x="1173" y="558" text-anchor="middle">2 · migrate</text>
<text class="s" x="1173" y="580" text-anchor="middle">the branch's</text>
<text class="s" x="1173" y="600" text-anchor="middle">schema changes,</text>
<text class="s" x="1173" y="618" text-anchor="middle">on real data</text>
<path class="arr" d="M1252 578 L1272 578"/>
<rect x="1276" y="532" width="170" height="92" rx="8" fill="#e3f6ef" stroke="#0f8a6a"/>
<text class="t g" x="1361" y="558" text-anchor="middle">3 · api + worker</text>
<text class="s" x="1361" y="580" text-anchor="middle">offline: fake model</text>
<text class="s" x="1361" y="600" text-anchor="middle">no payments, no bot</text>
<text class="s" x="1361" y="618" text-anchor="middle">health-checked</text>
<path class="arr" d="M1450 578 L1470 578"/>
<rect x="1474" y="532" width="170" height="92" rx="8" fill="#fff" stroke="#888"/>
<text class="t" x="1559" y="558" text-anchor="middle">4 · web</text>
<text class="s" x="1559" y="580" text-anchor="middle">the branch's app</text>
<text class="s" x="1559" y="600" text-anchor="middle">/app/api → api</text>
<text class="s" x="1559" y="618" text-anchor="middle">what Traefik reaches</text>
<rect x="1664" y="532" width="172" height="92" rx="8" fill="#fde8e6" stroke="#c0392b"/>
<text class="t r" x="1750" y="558" text-anchor="middle">4 · login</text>
<text class="s" x="1750" y="580" text-anchor="middle">/_factory/login</text>
<text class="s" x="1750" y="600" text-anchor="middle">fresh one-click link</text>
<text class="s" x="1750" y="618" text-anchor="middle">as the test account</text>
<text class="s" x="900" y="660">own Docker network per PR (+ the factory's database network) · every container refuses to start outside a PR preview</text>
<text class="s" x="900" y="684">own volume for the database password · Linux capabilities dropped · no new privileges</text>
<text class="s" x="900" y="708">every push: rebuilt and redeployed, the data you made is kept · close the PR: everything below is deleted</text>
<text class="s" x="900" y="730">the factory's admin database password reaches preview-init only, from a root-only file, never as a variable</text>

<!-- data stores -->
<text class="t o" x="44" y="630">What the preview gets copied (in about a second)</text>
<rect x="44" y="648" width="270" height="168" rx="10" fill="#fff1e0" stroke="#b7651a"/>
<text class="t o" x="60" y="676">relational database</text>
<text class="s" x="60" y="700">Postgres: CREATE DATABASE</text>
<text class="m" x="60" y="722">app_pr_41 TEMPLATE app_snapshot</text>
<text class="s" x="60" y="746">a file-level copy, &lt; 1 s</text>
<text class="s" x="60" y="770">owned by its own login app_pr_41,</text>
<text class="s" x="60" y="792">which can connect nowhere else</text>
<rect x="330" y="648" width="250" height="168" rx="10" fill="#fff1e0" stroke="#b7651a"/>
<text class="t o" x="346" y="676">vector database</text>
<text class="s" x="346" y="700">pgvector, inside the same</text>
<text class="s" x="346" y="722">Postgres database</text>
<text class="s" x="346" y="746">embeddings and search indexes</text>
<text class="s" x="346" y="770">come along with the copy:</text>
<text class="s" x="346" y="792">nothing separate to sync</text>
<rect x="596" y="648" width="260" height="168" rx="10" fill="#fff1e0" stroke="#b7651a"/>
<text class="t o" x="612" y="676">files (media)</text>
<text class="s" x="612" y="700">cp -al snapshot → pr-41</text>
<text class="s" x="612" y="722">hardlinks: instant, 0 bytes</text>
<text class="s" x="612" y="746">new uploads land only in pr-41</text>
<text class="s" x="612" y="770">(the app never edits a file</text>
<text class="s" x="612" y="792">in place)</text>
<path class="arrG" d="M856 700 L896 640"/>

<!-- what it does not get -->
<rect x="882" y="756" width="972" height="60" rx="10" fill="#fde8e6" stroke="#c0392b"/>
<text class="t r" x="900" y="782">What a preview never gets</text>
<text class="s" x="900" y="804">model or scraping keys (unless a "live" label asks) · payment keys · bot token · production data · a way back into staging</text>

<!-- snapshot pipeline -->
<text class="t g" x="44" y="862">Where the copy comes from · every night at 03:00</text>
<rect x="44" y="878" width="220" height="70" rx="8" fill="#fff1e0" stroke="#b7651a"/>
<text class="t o" x="154" y="906" text-anchor="middle">staging database</text><text class="s" x="154" y="928" text-anchor="middle">+ its files · read only</text>
<path class="arrG" d="M268 913 L312 913"/>
<rect x="316" y="878" width="240" height="70" rx="8" fill="#e3f6ef" stroke="#0f8a6a"/>
<text class="t g" x="436" y="906" text-anchor="middle">pg_dump → restore</text><text class="s" x="436" y="928" text-anchor="middle">into the factory's own Postgres</text>
<path class="arrG" d="M560 913 L604 913"/>
<rect x="608" y="878" width="330" height="70" rx="8" fill="#e3f6ef" stroke="#0f8a6a"/>
<text class="t g" x="773" y="906" text-anchor="middle">disarm</text><text class="s" x="773" y="928" text-anchor="middle">delete queued jobs · wipe payment tokens · drop logins</text>
<path class="arrG" d="M942 913 L986 913"/>
<rect x="990" y="878" width="300" height="70" rx="8" fill="#fff" stroke="#888"/>
<text class="t" x="1140" y="906" text-anchor="middle">app_snapshot</text><text class="s" x="1140" y="928" text-anchor="middle">a template nobody connects to</text>
<path class="arrG" d="M1294 913 L1338 913"/>
<rect x="1342" y="878" width="512" height="70" rx="8" fill="#fff" stroke="#888"/>
<text class="t" x="1598" y="906" text-anchor="middle">every new preview copies from here</text><text class="s" x="1598" y="928" text-anchor="middle">data flows down only · nothing from a preview goes back</text>
<text class="s" x="44" y="986">one Postgres for all previews of a project, separate databases and logins · real data, no anonymizing, but nothing in it can act on the world</text>
<text class="s" x="44" y="1010">Coolify's cleanup can't touch other images · its ports listen on 127.0.0.1 only · host nginx keeps 80/443 for every site on the server</text>
