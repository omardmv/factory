# Slack app for the factory: api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Factory
  description: The software factory - one channel per task
features:
  bot_user:
    display_name: factory
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /factory
      description: pause, resume, stop, status, tasks, digest, help
      usage_hint: pause | resume | stop | status | tasks | digest | help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - commands
      - im:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - channel_created
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
